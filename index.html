    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
              tech: ['Rajdhani', 'sans-serif'],
            },
            colors: {
              accent: {
                DEFAULT: '#00f3ff', // Cyan Neon
                glow: '#00f3ff',
                secondary: '#bc13fe', // Neon Purple
                tertiary: '#00ff9d', // Hacker Green
              },
              dark: {
                950: '#020203', // Darker black
                900: '#0a0a0f',
                800: '#12121a',
                700: '#1e1e2e',
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'spin-slow': 'spin 8s linear infinite',
              'spin-reverse': 'spin 10s linear infinite reverse',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glitch': 'glitch 1s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              glitch: {
                '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                '62%': { transform: 'translate(0,0) skew(5deg)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #020203;
        color: #fff;
        overflow-x: hidden;
      }
      
      /* CRT Scanline Effect */
      body::after {
        content: " ";
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        z-index: 2;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }

      /* 3D Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #020203;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #00f3ff, #bc13fe);
        border-radius: 4px;
        border: 2px solid #020203;
      }
      
      .text-glow {
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.5);
      }
      
      .neon-border {
        box-shadow: 0 0 5px #00f3ff, inset 0 0 5px #00f3ff;
      }

      .preserve-3d {
        transform-style: preserve-3d;
      }
      
      .backface-hidden {
        backface-visibility: hidden;
      }
      
      /* Custom Clip Path for Folder Tabs */
      .folder-shape {
        clip-path: polygon(0 0, 80% 0, 90% 20%, 100% 100%, 0% 100%);
      }
    </style>
